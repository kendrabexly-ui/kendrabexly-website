<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="An invitation into Kendra Bexly’s private world, created for those who appreciate confidence, chemistry, and time well spent.">
  <meta name="theme-color" content="#f5f1eb">
  <title>The Invitation | Kendra Bexly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="invitation-page">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="nav">
    <a class="brand" href="/" aria-label="Kendra Bexly home">Kendra Bexly</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" aria-label="Primary navigation">
      <a href="/" aria-current="page">The Invitation</a>
      <a href="/meet-kendra">Meet Kendra</a>
      <a href="/the-muse">The Muse</a>
      <a href="/our-time">Our Time</a>
      <a href="/etiquette">Etiquette</a>
      <a href="/pillow-talk">Pillow Talk</a>
      <a class="button small" href="/request">The Rendezvous</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero invitation" aria-labelledby="invitation-title">
      <div class="hero-content">
        <div class="eyebrow">THE INVITATION</div>
        <h1 id="invitation-title">Personal. Polished.<br>Unmistakably Kendra.</h1>
        <p class="lede">Welcome to my private corner of the world, created for those who appreciate confidence, chemistry, and time well spent.</p>
      </div>
      <div class="hero-mark" aria-hidden="true">KB</div>
    </section>
  </main>

  <script>
    const toggle = document.querySelector(".menu-toggle");
    const nav = document.getElementById("site-nav");

    const closeMenu = () => {
      toggle?.setAttribute("aria-expanded", "false");
      nav?.classList.remove("open");
    };

    toggle?.addEventListener("click", () => {
      const willOpen = toggle.getAttribute("aria-expanded") !== "true";
      toggle.setAttribute("aria-expanded", String(willOpen));
      nav?.classList.toggle("open", willOpen);
    });

    nav?.addEventListener("click", event => {
      if (event.target.closest("a")) closeMenu();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeMenu();
        toggle?.focus();
      }
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth > 1100) closeMenu();
    });
  </script>
</body>
</html>
