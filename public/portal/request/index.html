<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Request | Kendra Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      margin: 0;
      background: #f6f1e8;
      color: #24242b;
      font-family: "DM Sans", sans-serif;
    }

    .admin-top {
      background: #25252d;
      color: white;
      padding: 22px 6%;
    }

    .admin-top a {
      color: white;
      text-decoration: none;
    }

    .page {
      max-width: 1050px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      margin-bottom: 15px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-weight: 400;
      font-size: clamp(42px, 6vw, 72px);
      margin: 0 0 12px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
    }

    .request-card {
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(30,30,30,.12);
      border-radius: 22px;
      overflow: hidden;
    }

    .request-header {
      padding: 28px 32px;
      border-bottom: 1px solid rgba(30,30,30,.1);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .client-name {
      font-family: "Playfair Display", serif;
      font-size: 32px;
    }

    .status {
      padding: 8px 14px;
      border: 1px solid #bbb;
      border-radius: 999px;
      text-transform: capitalize;
      font-size: 13px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .detail {
      padding: 24px 32px;
      border-bottom: 1px solid rgba(30,30,30,.08);
    }

    .detail:nth-child(odd) {
      border-right: 1px solid rgba(30,30,30,.08);
    }

    .label {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .notes {
      padding: 30px 32px;
    }

    .notes .value {
      white-space: pre-wrap;
    }

    .message {
      padding: 35px;
      text-align: center;
      color: #666;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #24242b;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .details {
        grid-template-columns: 1fr;
      }

      .detail:nth-child(odd) {
        border-right: 0;
      }

      .request-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="admin-top">
    <a href="/portal">← Back to Kendra's Dashboard</a>
  </div>

  <main class="page">

    <a class="back" href="/portal">
      ← All Requests
    </a>

    <div class="eyebrow">
      Private Administration
    </div>

    <h1>Private Request</h1>

    <div class="subtitle">
      Review the request and complete only the next step needed.
    </div>
    <div id="request-workflow" style="display:none;margin:0 0 22px;padding:16px 18px;border:1px solid rgba(30,30,30,.12);border-radius:14px;background:rgba(255,255,255,.55);"></div>

    <div id="request-container" class="request-card">
      <div class="message">
        Loading request...
      </div>
    </div>

  </main>

  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function displayValue(value, fallback = "Not provided") {
      const text = String(value ?? "").trim();

      return text
        ? escapeHtml(text)
        : fallback;
    }

    async function loadRequest() {
      const container =
        document.getElementById("request-container");

      const params =
        new URLSearchParams(window.location.search);

      const id =
        params.get("id");

      if (!id) {
        container.innerHTML = `
          <div class="message">
            No request was selected.
          </div>
        `;
        return;
      }

      try {
       const response =
  await fetch(
    `/api/admin/request?id=${encodeURIComponent(id)}`
  );

        const data =
          await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.message ||
            "Unable to load this request."
          );
        }

        const item =
          data.request;

        const name =
          `${item.first_name || ""} ${item.last_name || ""}`.trim()
          || "Client";

        const workflow=document.getElementById("request-workflow");
        const workflowCopy={
          pending:["1 of 3 · Review Request","Review the request details. If everything looks right, move it forward to create the client's next email draft."],
          pending_final_approval:["2 of 3 · Final Approval","Confirm the deposit and ID screening, then give final approval."],
          screening_pending:["2 of 3 · Final Approval","Complete ID screening and deposit confirmation before final approval."],
          approved:["3 of 3 · Confirmed","This date is confirmed. After the appointment, mark it Successfully Completed."],
          completed:["Completed","This date has been successfully completed. Follow-up activity is handled from the client profile and Email Drafts."],
          canceled:["Canceled","No action is required unless you need to review this request."],
          blacklisted_submission:["Safety Review","This submission is linked to a blacklisted client. Review the safety record before taking any action."]
        };
        const flow=workflowCopy[String(item.status||"pending").toLowerCase()]||workflowCopy.pending;
        if(workflow){workflow.style.display="block";workflow.innerHTML='<strong>'+escapeHtml(flow[0])+'</strong><div style="margin-top:5px;font-size:13px;color:#6f675f;line-height:1.5;">'+escapeHtml(flow[1])+'</div>';}

        container.innerHTML = `
          <div class="request-header">

            <div>
              <div class="client-name">
                ${escapeHtml(name)}
              </div>
              <button type="button" id="view-client-profile-button" style="margin-top:10px;padding:8px 13px;border:1px solid #cfc6ba;border-radius:999px;background:white;font-family:inherit;cursor:pointer;">
                View Client Profile
              </button>
            </div>

            <div class="status">
              ${displayValue(item.status, "Pending").replaceAll("_", " ").replace(/\b\w/g, ch => ch.toUpperCase())}
            </div>

          </div>

          <div class="details">

            <div class="detail">
              <div class="label">Email</div>
              <div class="value">
                ${displayValue(item.email)}
              </div>
            </div>

            <div class="detail">
              <div class="label">Phone</div>
              <div class="value">
                ${displayValue(item.phone)}
              </div>
            </div>

            <div class="detail">
              <div class="label">Requested Date</div>
              <div class="value">
                ${displayValue(item.requested_date)}
              </div>
            </div>

            <div class="detail">
              <div class="label">Requested Time</div>
              <div class="value">
                ${displayValue(item.requested_time)}
              </div>
            </div>

            <div class="detail">
              <div class="label">Location</div>
              <div class="value">
                ${displayValue(item.location_name)}
              </div>
            </div>

            <div class="detail">
              <div class="label">Approval Progress</div>
              <div class="value">
                ${item.deposit_paid ? "✓ Deposit confirmed" : "○ Deposit pending"} · ${item.id_received ? "✓ ID screened" : "○ ID screening pending"}
              </div>
            </div>

            <div class="detail">
              <div class="label">ID Received</div>
              <div class="value">
                ${item.id_received ? "Yes" : "No"}
              </div>
            </div>

            <div class="detail">
              <div class="label">Deposit Paid</div>
              <div class="value">
                ${item.deposit_paid ? "Yes" : "No"}
              </div>
            </div>

          </div>

          ${String(item.notes || "").includes("Newsletter special: Newsletter #") ? `
          <div style="margin:24px 0;padding:20px;border:1px solid #d8cbb9;background:#f6f1e8;border-radius:12px;">
            <div class="label">✨ NEWSLETTER SPECIAL</div>
            <div class="value" style="margin-top:8px;font-weight:600;">
              Subscriber offer attached to this request
            </div>
            <div class="value" style="margin-top:8px;white-space:pre-line;">
              ${displayValue((String(item.notes).match(/Newsletter special: Newsletter #[^\n]*(?:\nOffer: [\s\S]*?)(?=\n(?:Date type:|Appointment type:|Duration:|Request details:|Screening requirement|25% deposit)|$)/) || [""])[0])}
            </div>
          </div>
          ` : ""}

          <div class="notes">
            <div class="label">
              Request Details
            </div>

            <div class="value">
              ${displayValue(item.notes)}
            </div>
          </div>
          <div style="margin-top: 32px;">
  <button
    type="button"
    id="move-forward-button"
    style="
      background: #25252d;
      color: white;
      border: none;
      padding: 15px 28px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    "
  >
    Move Forward
  </button>
  <div style="margin-top:10px;font-size:13px;color:#6f675f;">
    Moving forward creates the client's next email draft. After it is created, review it in <strong>Email Drafts</strong>.
  </div>
  <button type="button" id="open-email-drafts-button" style="display:none;margin-top:10px;background:transparent;border:1px solid #cfc6ba;padding:10px 16px;border-radius:999px;font-family:inherit;cursor:pointer;">
    Review Email Draft
  </button>
<div
  id="final-approval-controls"
  style="display: none; margin-top: 24px;padding:20px;border:1px solid #ded7cd;background:#fffdf9;border-radius:14px;"
>
  <div class="label">FINAL APPROVAL</div>
  <div style="margin:6px 0 16px;font-size:14px;color:#6f675f;">Complete both checks below before confirming the date.</div>
  <div style="display:grid;gap:10px;margin-bottom:18px;">
    <label style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #ded7cd;border-radius:10px;background:white;cursor:pointer;">
      <input type="checkbox" id="id-received-checkbox" style="margin-top:3px;">
      <span><strong>ID & Screening</strong><br><small style="color:#6f675f;">ID received and screening completed</small></span>
    </label>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid #ded7cd;border-radius:10px;background:white;flex-wrap:wrap;">
      <span><strong>Deposit</strong><br><small id="deposit-check-label" style="color:#6f675f;">${item.deposit_paid ? "Confirmed" : (Number(item.deposit_amount||0)>0 ? "Expected: $" + Number(item.deposit_amount).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : "Amount not calculated")}</small></span>
      <button type="button" id="confirm-deposit-button" style="background:#25252d;color:white;border:none;padding:10px 16px;border-radius:999px;font-family:inherit;cursor:pointer;">
        ${item.deposit_paid ? "✓ Confirmed" : "Confirm Paid"}
      </button>
    </div>
  </div>
  <div id="deposit-status" style="margin:-8px 0 14px;font-size:13px;"></div>
  <div id="post-deposit-summary" style="display:none;"></div>

  ${String(item.notes || "").includes("Newsletter special: Newsletter #") ? `
  <label style="display:block;margin-bottom:20px;padding:14px 16px;background:#f6f1e8;border:1px solid #d8cbb9;border-radius:10px;">
    <input type="checkbox" id="newsletter-special-approval-checkbox">
    Approve the attached newsletter special for this date
  </label>
  ` : ""}

  <button
    type="button"
    id="final-approve-button"
    style="
      background: #25252d;
      color: white;
      border: none;
      padding: 15px 28px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    "
  >
    Final Approve
  </button>
  <div id="final-approval-readiness" style="margin-top:10px;font-size:13px;color:#6f675f;"></div>

  <div
    id="final-approval-status"
    style="margin-top: 12px;"
  ></div>
</div>
  <div
    id="move-forward-status"
    style="margin-top: 12px;"
  ></div>
  <div id="completed-date-controls" style="${item.status === "approved" ? "" : "display:none;"}margin-top:24px;padding:18px 20px;border:1px solid #ded7cd;background:#fffdf9;border-radius:14px;">
    <div class="label">AFTER THE DATE</div>
    <strong style="display:block;margin-top:6px;">Complete this only after the appointment has ended.</strong>
    <div style="margin:6px 0 14px;font-size:13px;color:#6f675f;line-height:1.5;">Marking the date successfully completed will create the After Date Follow Up draft for this specific appointment. Nothing is sent automatically.</div>
    <button type="button" id="mark-date-completed-button" style="background:#25252d;color:white;border:none;padding:12px 20px;border-radius:999px;font-family:inherit;cursor:pointer;">Mark Successfully Completed</button>
    <div id="completed-date-status" style="margin-top:10px;font-size:13px;"></div>
  </div>
</div>
        `;
   const viewClientProfileButton =
  document.getElementById("view-client-profile-button");
if (viewClientProfileButton) {
  viewClientProfileButton.addEventListener("click", () => {
    const params = new URLSearchParams({
      section: "clients",
      client_id: String(item.client_id || ""),
      client_email: String(item.email || "")
    });
    window.location.href = "/portal?" + params.toString();
  });
}

   const finalApprovalControls =
  document.getElementById("final-approval-controls");

const moveForwardButton =
  document.getElementById("move-forward-button");

if (["pending_final_approval", "screening_pending"].includes(item.status)) {
 moveForwardButton.style.display = "none";
finalApprovalControls.style.display = "block";
}

const inactiveRequest=["canceled","blacklisted_submission","completed"].includes(String(item.status||"").toLowerCase());
if(inactiveRequest){
  moveForwardButton.style.display="none";
  finalApprovalControls.style.display="none";
  openEmailDraftsButton.style.display="none";
}
if(String(item.status||"").toLowerCase()==="completed"){
  const completedControls=document.getElementById("completed-date-controls");
  if(completedControls) completedControls.style.display="none";
}
if(String(item.status||"").toLowerCase()==="canceled"){
  const statusBadge=container.querySelector(".status");
  if(statusBadge) statusBadge.textContent="Canceled";
}
if(String(item.status||"").toLowerCase()==="blacklisted_submission"){
  const statusBadge=container.querySelector(".status");
  if(statusBadge) statusBadge.textContent="Blacklisted Submission";
  const profileButton=document.getElementById("view-client-profile-button");
  if(profileButton) profileButton.textContent="Review Client Safety Record";
}

const moveForwardStatus =
  document.getElementById("move-forward-status");
const markDateCompletedButton=document.getElementById("mark-date-completed-button");
const completedDateStatus=document.getElementById("completed-date-status");
if(markDateCompletedButton){
  markDateCompletedButton.addEventListener("click",async()=>{
    if(!window.confirm("Mark this date successfully completed and create the after date follow up draft?"))return;
    markDateCompletedButton.disabled=true;completedDateStatus.textContent="Completing date and drafting follow up...";
    try{
      const response=await fetch("/api/admin/request/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:Number(id)})});
      const result=await response.json();
      if(!response.ok||!result.ok)throw new Error(result.message||"Unable to complete date.");
      completedDateStatus.innerHTML='<strong>✓ Date successfully completed.</strong><div style="margin-top:5px;">The After Date Follow Up draft is ready for review.</div>';
      markDateCompletedButton.textContent="✓ Successfully Completed";
      markDateCompletedButton.disabled=true;
      const statusBadge=container.querySelector(".status"); if(statusBadge)statusBadge.textContent="Completed";
      const workflow=document.getElementById("request-workflow");
      if(workflow)workflow.innerHTML='<strong>Completed</strong><div style="margin-top:5px;font-size:13px;color:#6f675f;line-height:1.5;">This date is complete. Review the After Date Follow Up draft before sending it.</div>';
      let followupButton=document.getElementById("review-after-date-followup");
      if(!followupButton){followupButton=document.createElement("button");followupButton.id="review-after-date-followup";followupButton.type="button";followupButton.style.cssText="margin-top:12px;background:transparent;border:1px solid #cfc6ba;padding:10px 16px;border-radius:999px;font-family:inherit;cursor:pointer;";completedDateStatus.after(followupButton);}
      followupButton.textContent="Review After Date Follow Up";
      followupButton.onclick=()=>{window.location.href="/portal?section=emails&request_id="+encodeURIComponent(id);};
    }catch(error){completedDateStatus.textContent=error.message||"Unable to complete date.";markDateCompletedButton.disabled=false;}
  });
}
const openEmailDraftsButton =
  document.getElementById("open-email-drafts-button");

if (["pending_final_approval", "screening_pending"].includes(item.status)) {
  openEmailDraftsButton.style.display = "inline-block";
}
openEmailDraftsButton.addEventListener("click", () => {
  window.location.href = "/portal?section=emails&request_id=" + encodeURIComponent(id);
});

moveForwardButton.addEventListener(
  "click",
  async function () {

    moveForwardButton.disabled = true;
    moveForwardStatus.textContent =
      "Moving request forward...";

    try {
      const response = await fetch(
        "/api/admin/request/move-forward",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: Number(id)
          })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(
          result.message ||
          "Unable to move request forward."
        );
      }

      moveForwardStatus.textContent =
        result.deposit_amount > 0
          ? "Request moved forward. Expected 25% deposit: $" + Number(result.deposit_amount).toFixed(2)
          : "Request moved forward. Deposit amount could not be calculated from the selected duration.";

      const depositCheckLabel = document.getElementById("deposit-check-label");
      if (depositCheckLabel) {
        depositCheckLabel.textContent = Number(result.deposit_amount || 0) > 0
          ? "Expected: $" + Number(result.deposit_amount).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2})
          : "Amount not calculated";
      }
      moveForwardButton.textContent =
        "Moved Forward";
      moveForwardButton.style.display = "none";
      finalApprovalControls.style.display = "block";
      openEmailDraftsButton.style.display = "inline-block";
      moveForwardStatus.textContent += " Email draft is ready for review.";

    } catch (error) {
      console.error(
        "Move forward error:",
        error
      );

      moveForwardStatus.textContent =
        "Unable to move request forward.";

      moveForwardButton.disabled = false;
    }
  }
);
const finalApproveButton =
  document.getElementById("final-approve-button");

const finalApprovalStatus =
  document.getElementById("final-approval-status");

const idReceivedCheckbox =
  document.getElementById("id-received-checkbox");

const confirmDepositButton =
  document.getElementById("confirm-deposit-button");
const depositStatus = document.getElementById("deposit-status");
const postDepositSummary = document.getElementById("post-deposit-summary");

idReceivedCheckbox.checked = Boolean(item.id_received);
let depositConfirmed = Boolean(item.deposit_paid);

// Existing requests created before deposit calculation was fixed can still
// have a zero stored amount. Calculate and display it before payment is marked paid.
async function refreshMissingDeposit(){
  if (Number(item.deposit_amount || 0) > 0 || item.deposit_paid) return;
  const label=document.getElementById("deposit-check-label");
  if(label) label.textContent="Calculating deposit...";
  try{
    const response=await fetch("/api/admin/request/calculate-deposit",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:Number(id)})
    });
    const result=await response.json();
    if(!response.ok||!result.ok) throw new Error(result.message||"Unable to calculate deposit.");
    item.deposit_amount=Number(result.deposit_amount||0);
    if(label) label.textContent="Expected: $"+item.deposit_amount.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  }catch(error){
    if(label) label.textContent="Amount not calculated";
    depositStatus.textContent=error.message||"Unable to calculate deposit.";
  }
}
refreshMissingDeposit();
const finalApprovalReadiness=document.getElementById("final-approval-readiness");
function updateFinalApprovalReadiness(){
  const specialReady=!newsletterSpecialApprovalCheckbox || newsletterSpecialApprovalCheckbox.checked;
  const ready=Boolean(idReceivedCheckbox.checked && depositConfirmed && specialReady);
  finalApproveButton.disabled=!ready;
  finalApproveButton.style.opacity=ready?"1":".5";
  finalApproveButton.style.cursor=ready?"pointer":"not-allowed";
  if(finalApprovalReadiness) finalApprovalReadiness.textContent=ready
    ? "✓ Ready for final approval."
    : "Complete "+[!idReceivedCheckbox.checked?"ID screening":"",!depositConfirmed?"deposit confirmation":"",!specialReady?"newsletter special approval":""].filter(Boolean).join(" and ")+".";
}
if (item.deposit_paid) {
  confirmDepositButton.disabled = true;
  confirmDepositButton.textContent = "✓ Confirmed";
}
idReceivedCheckbox.addEventListener("change",updateFinalApprovalReadiness);

confirmDepositButton.addEventListener("click", async function () {
  confirmDepositButton.disabled = true;
  depositStatus.textContent = "Confirming deposit...";
  try {
    const response = await fetch("/api/admin/request/confirm-deposit", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:Number(id)})
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.message || "Unable to confirm deposit.");
    confirmDepositButton.textContent = "✓ Confirmed";
    depositConfirmed = true;
    const depositCheckLabel=document.getElementById("deposit-check-label");
    if(depositCheckLabel) depositCheckLabel.textContent="Confirmed";
    depositStatus.textContent = "Deposit payment confirmed.";
    updateFinalApprovalReadiness();
  } catch (error) {
    depositStatus.textContent = error.message || "Unable to confirm deposit.";
    confirmDepositButton.disabled = false;
  }
});

const newsletterSpecialApprovalCheckbox =
  document.getElementById("newsletter-special-approval-checkbox");
if(newsletterSpecialApprovalCheckbox) newsletterSpecialApprovalCheckbox.addEventListener("change",updateFinalApprovalReadiness);
updateFinalApprovalReadiness();
        finalApproveButton.addEventListener(
  "click",
  async function () {

    if (
      !idReceivedCheckbox.checked ||
      !depositConfirmed
    ) {
      finalApprovalStatus.textContent =
        "Please confirm both the ID screening and deposit before final approval.";
      return;
    }

    if (
      newsletterSpecialApprovalCheckbox &&
      !newsletterSpecialApprovalCheckbox.checked
    ) {
      finalApprovalStatus.textContent =
        "Please approve the attached newsletter special before final approval.";
      return;
    }

    finalApproveButton.disabled = true;
    finalApprovalStatus.textContent =
      "Finalizing approval...";

    try {
  const response = await fetch(
    "/api/admin/request/final-approve",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: Number(id),
        id_received: true,
        deposit_paid: true,
        newsletter_special_approved: newsletterSpecialApprovalCheckbox ? newsletterSpecialApprovalCheckbox.checked : false
      })
    }
  );

  const result = await response.json();

  if (!response.ok || !result.ok) {
    throw new Error(
      result.message ||
      "Unable to complete final approval."
    );
  }

      finalApprovalStatus.innerHTML =
