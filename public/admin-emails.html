<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Drafts | Kendra Bexly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      background: #f7f3eb;
      color: #252329;
      margin: 0;
    }

    .admin-header {
      padding: 24px;
      border-bottom: 1px solid #ddd6ca;
      background: #faf7f1;
    }

    .admin-header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .admin-header h1 {
      font-family: "Playfair Display", serif;
      margin: 0;
      font-size: 28px;
    }

    .admin-header a {
      color: #252329;
      text-decoration: none;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 24px 80px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777168;
      margin-bottom: 12px;
    }

    .page h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(36px, 6vw, 58px);
      font-weight: 500;
      margin: 0 0 12px;
    }

    .intro {
      color: #777168;
      margin-bottom: 38px;
    }

    .message {
      padding: 24px;
      border: 1px solid #ddd6ca;
      border-radius: 16px;
      background: #fffdf9;
    }

    .draft-card {
      background: #fffdf9;
      border: 1px solid #ddd6ca;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 22px;
    }

    .draft-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    .draft-name {
      font-family: "Playfair Display", serif;
      font-size: 25px;
      margin: 0 0 5px;
    }

    .draft-email {
      color: #777168;
      font-size: 14px;
    }

    .status {
      border: 1px solid #ccc4b8;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #777168;
      margin-bottom: 6px;
    }

    .subject {
      font-weight: 600;
      margin-bottom: 22px;
    }

    .email-body {
      white-space: pre-wrap;
      line-height: 1.7;
      padding: 20px;
      background: #f8f4ed;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .meta {
      font-size: 13px;
      color: #777168;
    }

    @media (max-width: 650px) {
      .draft-top {
        flex-direction: column;
      }
    }
.draft-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}

.edit-button,
.save-button {
  border: 1px solid #252329;
  padding: 10px 16px;
  font: inherit;
  cursor: pointer;
  border-radius: 4px;
}

.edit-button {
  background: transparent;
  color: #252329;
}

.save-button {
  background: #252329;
  color: #fff;
}

.email-subject,
.email-body {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
}

.email-subject {
  padding: 10px;
  margin-bottom: 14px;
}

.email-body {
  min-height: 220px;
  padding: 12px;
  resize: vertical;
}
    
  </style>
</head>

<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <h1>Kendra Bexly</h1>
      <a href="/admin.html">← Admin Dashboard</a>
    </div>
  </header>

  <main class="page">

    <div class="eyebrow">Admin</div>

    <h2>Email Drafts</h2>

    <p class="intro">
      Review generated client emails before they are sent.
    </p>

    <div id="drafts">
      <div class="message">
        Loading email drafts...
      </div>
    </div>

  </main>

  <script>
    const draftsContainer =
      document.getElementById("drafts");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadDrafts() {
      try {
        const response =
          await fetch("/api/admin/email-drafts");

        const result =
          await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message ||
            "Unable to load email drafts."
          );
        }

        const drafts =
          result.email_drafts || [];

        if (!drafts.length) {
          draftsContainer.innerHTML = `
            <div class="message">
              No email drafts yet.
            </div>
          `;
          return;
        }

        draftsContainer.innerHTML =
          drafts.map((draft) => {

            const fullName =
              [
                draft.first_name,
                draft.last_name
              ]
              .filter(Boolean)
              .join(" ") ||
              "Client";

            const created =
              draft.created_at
                ? new Date(
                    draft.created_at + "Z"
                  ).toLocaleString()
                : "";

            return `
              <article class="draft-card">

                <div class="draft-top">

                  <div>
                    <h3 class="draft-name">
                      ${escapeHtml(fullName)}
                    </h3>

                    <div class="draft-email">
                      ${escapeHtml(draft.email)}
                    </div>
                  </div>

                  <div class="status">
                    ${escapeHtml(draft.status)}
                  </div>

                </div>

                <div class="label">
                  Email Type
                </div>

                <div style="margin-bottom:20px;">
                  ${escapeHtml(draft.email_type)}
                </div>

                <div class="label">
  Subject
</div>

<div
  class="subject"
  id="subject-${draft.id}"
>
  ${escapeHtml(draft.subject || "")}
</div>

<input
  class="email-subject"
  id="subject-input-${draft.id}"
  type="text"
  value="${escapeHtml(draft.subject || "")}"
  style="display:none;"
>

<div class="label">
  Draft
</div>

<div
  class="email-body"
  id="body-${draft.id}"
>
  ${escapeHtml(draft.body || "")}
</div>

<textarea
  class="email-body"
  id="body-input-${draft.id}"
  style="display:none;"
>${escapeHtml(draft.body || "")}</textarea>

<div class="draft-actions">
  <button
    type="button"
    class="edit-button"
    id="edit-${draft.id}"
    onclick="editDraft(${draft.id})"
  >
    Edit Draft
  </button>

  <button
    type="button"
    class="save-button"
    id="save-${draft.id}"
    onclick="saveDraft(${draft.id})"
    style="display:none;"
  >
    Save Changes
  </button>
</div>

<div class="meta">
  Created: ${escapeHtml(created)}
</div>
              </article>
            `;
          })
          .join("");

      } catch (error) {
        console.error(
          "Email drafts loading error:",
          error
        );

        draftsContainer.innerHTML = `
          <div class="message">
            Unable to load email drafts.
          </div>
        `;
      }
    }
function editDraft(id) {
  const subjectDisplay =
    document.getElementById(`subject-${id}`);

  const bodyDisplay =
    document.getElementById(`body-${id}`);

  const subjectInput =
    document.getElementById(`subject-input-${id}`);

  const bodyInput =
    document.getElementById(`body-input-${id}`);

  const editButton =
    document.getElementById(`edit-${id}`);

  const saveButton =
    document.getElementById(`save-${id}`);

  subjectDisplay.style.display = "none";
  bodyDisplay.style.display = "none";

  subjectInput.style.display = "block";
  bodyInput.style.display = "block";

  editButton.style.display = "none";
  saveButton.style.display = "inline-block";
}

async function saveDraft(id) {
  const subjectInput =
    document.getElementById(`subject-input-${id}`);

  const bodyInput =
    document.getElementById(`body-input-${id}`);

  const saveButton =
    document.getElementById(`save-${id}`);

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  try {
    const response = await fetch(
      `/api/admin/email-drafts/${id}`,
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          subject: subjectInput.value,
          body: bodyInput.value
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(
        result.message || "Unable to save draft."
      );
    }

    await loadDrafts();

  } catch (error) {
    console.error(
      "Email draft save error:",
      error
    );

    alert("Unable to save the email draft.");

    saveButton.disabled = false;
    saveButton.textContent = "Save Changes";
  }
}
    loadDrafts();
  </script>

</body>
</html>
