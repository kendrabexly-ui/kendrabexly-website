name: Isolated Mobile Booking E2E
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/mobile-booking.e2e.mjs'
      - '.github/workflows/mobile-booking-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local Worker
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/kendra-local-worker.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/booking/ -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/kendra-local-worker.log
          exit 1
      - name: Run mobile browser tests (all external requests blocked)
        run: node tests/mobile-booking.e2e.mjs
