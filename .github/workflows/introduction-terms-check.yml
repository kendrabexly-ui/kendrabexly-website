name: Introduction terms checks
on:
  push:
    branches: [feature/intro-terms-editor]
  pull_request:
    paths:
      - 'src/**'
      - 'public/portal/index.html'
      - 'tests/**'
      - 'migrations/introduction_terms_acceptances.sql'
      - 'wrangler.jsonc'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/kendra-worker-check
